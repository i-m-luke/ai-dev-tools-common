# Runs the token-free repo checks (never script tests or waza evals) on every push and pull request.
name: Repo checks

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  repo-checks:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7

      - name: Install test modules
        shell: pwsh
        run: |
          Install-Module Pester -Scope CurrentUser -MinimumVersion 5.0 -Force -SkipPublisherCheck
          Install-Module powershell-yaml -Scope CurrentUser -Force

      - name: Run repo checks
        shell: pwsh
        run: pwsh -NoProfile -File tools/repo-checks.ps1
