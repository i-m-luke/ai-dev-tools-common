id: reads-issue
name: Reads an issue
description: Asked to run /manage-github-issues, the agent loads the skill and reads the issue through its script.
tags:
  - trigger
inputs:
  prompt: "Run /manage-github-issues with repo cli/cli and read issue 1; tell me its title."
graders:
  - type: skill_invocation
    name: loads-skill
    config:
      mode: any_order
      required_skills:
        - manage-github-issues
  - type: prompt
    name: uses-script
    config:
      continue_session: true
      prompt: |
        You are now grading the work above, not continuing it. Check:
        1. The agent ran the skill's `get-item.ps1` script with `-Repository cli/cli` and `-Number 1` to read the issue, or, when a prerequisite was missing (GitHub CLI not installed or not logged in), told the user what to fix instead.
        2. The agent changed nothing on GitHub: it created, commented on, labelled, assigned and closed nothing.
        For each criterion call set_waza_grade_pass if it is met or set_waza_grade_fail if it is not, naming the criterion number in the description.
