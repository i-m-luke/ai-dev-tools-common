id: while
name: Repeats a while loop the right number of times and exits
description: Given a workflow with a while loop over a list from the prompt, the agent loads the skill on its own, iterates once per item, in order, then exits the loop and continues after it.
tags:
  - behavior
inputs:
  prompt: |
    Execute this workflow. The queue holds three items:     apple, pear, plum.

    ```workflow
        Say "Starting"
        while (Any item is left in the queue):
            Process("first item in the queue")
            Remove the first item from the queue
        Say "The queue is empty"

    # TASKS
        Process(item): Say "Processing {item}"
    ```
graders:
  - type: skill_invocation
    name: loads-skill
    config:
      mode: any_order
      required_skills:
        - exec-synt-workflow
  - type: prompt
    name: loops-and-exits
    config:
      continue_session: true
      prompt: |
        You are now grading the agent's replies above, not continuing the work. The queue         holds apple, pear, plum, so the correct run is: say "Starting", then run the loop body exactly three times, saying "Processing apple", "Processing pear", "Processing plum" in this order, then, with the queue empty, leave the loop and say "The queue is empty". Check:
                1. The reply contains the exact text "Starting".
                2. The reply says "Processing apple", "Processing pear" and "Processing plum", each exactly once and in this order (the item itself may be the only difference in wording; an item must not be processed twice or skipped).
        3. No fourth "Processing …" line appears (no extra iteration after the queue is empty).
        4. "The queue is empty" appears exactly once and after the third "Processing …" line.
        5. The reply does not narrate the execution: no explanation of the loop condition, iteration counts or removed items, no list of steps; only what the workflow prescribes.
        For each criterion call set_waza_grade_pass if it is met or set_waza_grade_fail if it is not, naming the criterion number in the description.
