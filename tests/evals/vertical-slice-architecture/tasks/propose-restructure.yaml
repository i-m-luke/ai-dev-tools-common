id: propose-restructure
name: Proposes a capability-cut tree
description: Given a layered project, the agent loads the skill on its own and proposes feature slices with shared code and composition roots kept apart.
tags:
  - behavior
inputs:
  prompt: "Propose a new folder structure for this project. Don't move or edit any files; reply with the proposed tree and a short rationale."
  context:
    fixture: fixtures/shop
graders:
  - type: skill_invocation
    name: loads-skill
    config:
      mode: any_order
      required_skills:
        - vertical-slice-architecture
  - type: file
    name: files-untouched
    config:
      must_exist:
        - Controllers/OrdersController.cs
        - Services/EmailSender.cs
        - Pages/DashboardPage.cs
  - type: prompt
    name: cuts-by-capability
    config:
      continue_session: true
      prompt: |
        You are now grading the proposal above, not continuing it. Check the proposed tree:
        1. The top level is cut by capability (ordering, invoicing); controllers, services and models appear only as folders inside a capability, never as top-level folders.
        2. EmailSender goes to a shared area outside the capabilities, because both ordering and invoicing use it.
        3. DashboardPage stays outside the capability folders as a thin composition root (for example under Pages/).
        4. Order sits in the ordering capability and Invoice in the invoicing capability, not in a shared models folder.
        For each criterion call set_waza_grade_pass if it is met or set_waza_grade_fail if it is not, naming the criterion number in the description.
