id: visualizes-approved-interaction-plan
name: Reads the design visualization doc for an approved plan shaping an interaction
description: "Given a plan in which services call each other in order, approved with visuals requested, the agent reads the design visualization doc and writes no code before the user confirms the visuals."
tags:
  - behavior
inputs:
  prompt: |
    I approve this plan with visuals first, go ahead:
    - Add `src/checkout.ts` with `Checkout.submit(cart)`: it awaits `PaymentGateway.charge(cart.total)`; on success it calls `Inventory.reserve(cart.items)`, on failure `Notifier.alert(error)`.
    - Add `src/paymentGateway.ts`, `src/inventory.ts` and `src/notifier.ts` with these methods as stubs.
  context:
    fixture: fixtures/workspace
graders:
  - type: tool_constraint
    name: reads-design-visualization-doc
    config:
      expect_tools:
        - tool: "view"
          path_pattern: 'agents-shared[\\/]design-visualization\.md$'
  - type: file
    name: no-code-before-confirmation
    config:
      must_not_exist:
        - src/checkout.ts
        - src/paymentGateway.ts
        - src/inventory.ts
        - src/notifier.ts
