id: visualizes-approved-model-plan
name: Reads the design visualization doc for an approved plan shaping types
description: "Given a plan that adds a class and its API, approved with visuals requested, the agent reads the design visualization doc and writes no code before the user confirms the visuals."
tags:
  - behavior
inputs:
  prompt: |
    I approve this plan with visuals first, go ahead:
    - Add `src/OrderService.cs` with class `OrderService` exposing `Orders` (a read-only list of `Order`) and `Place(Order order)` returning the new order's id.
    - Add `src/Order.cs` with record `Order` holding `Id` and a list of `OrderItem` (`Sku`, `Quantity`).
  context:
    fixture: fixtures/workspace
graders:
  - type: tool_constraint
    name: reads-design-visualization-doc
    config:
      expect_tools:
        - tool: "view"
          path_pattern: 'agents-shared[\\/]design-visualization\.md$'
  - type: file
    name: no-code-before-confirmation
    config:
      must_not_exist:
        - src/OrderService.cs
        - src/Order.cs
