name: agents-shared
description: Checks that the shared instructions make the agent read the roles doc when roles are assigned and the glossary when it meets an unfamiliar term, and that reading the glossary shapes the result.
version: "1.0"
config:
  trials_per_task: 1
  timeout_seconds: 300
  executor: copilot-sdk
  model: claude-sonnet-5.5
metrics:
  - name: task_completion
    weight: 1.0
    threshold: 1.0
tasks:
  - "tasks/*.yaml"
