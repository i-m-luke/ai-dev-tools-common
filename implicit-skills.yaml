# Convention skills approved to stay implicit (see docs/guidelines/skills.md#invocation).
# Each entry maps the skill name to the reason it loads without being named.
skill-authoring: Skill-authoring convention — applies to every task that creates or edits a skill.
vertical-slice-architecture: Architecture convention — applies to every task that places files or shapes folders.
win-app-spy: Tool skill — its fixed description lets the agent load it on its own whenever a task needs a Windows app's UI.
