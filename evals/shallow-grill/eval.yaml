name: shallow-grill
description: Checks that /shallow-grill runs grilling as shallow planning and stops when grilling is missing.
skill: shallow-grill
version: "1.0"
config:
  trials_per_task: 1
  timeout_seconds: 600
  executor: copilot-sdk
  model: claude-sonnet-5.5
  # User-invoked skill: the SDK does not expand slash commands, so the body is injected
  # to stand in for the user typing /shallow-grill.
  inject_skill_body: true
  skill_directories:
    - ../../skills
    # `grilling` is an external skill; a local stub keeps the eval independent of what is installed.
    # It lives outside this folder, which waza always scans for skills, so a task can leave it out.
    - ../_stub-skills
metrics:
  - name: task_completion
    weight: 1.0
    threshold: 1.0
tasks:
  - "tasks/*.yaml"
