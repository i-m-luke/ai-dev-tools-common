id: roles-change
name: Prints a new line when the role set changes
description: When the user changes the set of roles in a second turn, the reply to it opens with a new ACTIVATED ROLES line with the new set.
tags:
  - behavior
inputs:
  prompt: "Roles: Teacher. Explain in one sentence what a variable is."
  context:
    fixture: fixtures/workspace
  responder:
    # Claude models tend to call a second decision tool after the first, which waza rejects.
    model: gpt-5.4
    instructions: |
      You are the user who started this conversation. After the agent's first reply, send exactly this message: "Roles: Teacher, Translator. Now explain in one sentence what a constant is."
      After the agent's reply to that message, call responder_stop.
      Call exactly one decision tool per agent message, once, and then end your turn.
    max_followups: 2
graders:
  - type: text
    name: new-line-with-new-set
    config:
      regex_match:
        - 'ACTIVATED ROLES: Teacher, Translator[*_` ]*(?:\n|\z)'
