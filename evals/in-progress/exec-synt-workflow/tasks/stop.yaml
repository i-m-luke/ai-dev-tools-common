id: stop
name: Stop inside a task ends the whole workflow
description: Given a workflow whose task calls Stop with a reason, the agent loads the skill on its own, says the steps before the Stop, reports the reason and executes no step after it, neither in the task nor in the main flow.
tags:
  - behavior
inputs:
  prompt: |
    Execute this workflow. The invoice is damaged.

    ```workflow
    Say "Starting processing"
    Process("invoice")
    Say "Processing finished"

    # TASKS
    Process(document):
        Say "Processing {document}"
        if (The document is damaged):
            Stop("The document is damaged")
        Say "Document {document} processed"
    ```
graders:
  - type: skill_invocation
    name: loads-skill
    config:
      mode: any_order
      required_skills:
        - exec-synt-workflow
  - type: prompt
    name: stops-with-reason
    config:
      continue_session: true
      prompt: |
        You are now grading the agent's replies above, not continuing the work. The workflow         calls the task Process("invoice"), which says "Processing invoice", then, because the invoice is damaged, calls Stop("The document is damaged"). The correct run: say "Starting processing", say "Processing invoice", then end the whole workflow and tell the user the reason "The document is damaged". Check:
                1. The reply contains the exact text "Starting processing".
                2. The reply contains the exact text "Processing invoice".
                3. The reply tells the user the reason for stopping: the Stop reason "The document is damaged" (verbatim or clearly the same message).
                4. The reply does not contain "Document invoice processed" (the step in the task after Stop).
                5. The reply does not contain "Processing finished" (the step in the main flow after the task call).
        For each criterion call set_waza_grade_pass if it is met or set_waza_grade_fail if it is not, naming the criterion number in the description.
