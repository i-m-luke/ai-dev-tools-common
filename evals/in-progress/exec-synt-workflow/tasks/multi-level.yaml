id: multi-level
name: Follows a multi-level workflow with nested if in a while and tasks calling tasks
description: Given a workflow with an if/else nested inside a while loop and parameterised tasks that call other tasks, the agent loads the skill on its own and follows the whole flow exactly, with the right branch, arguments and output order for every item.
tags:
  - behavior
inputs:
  prompt: |
    Execute this workflow. The queue holds four orders, in this order (price, club member):
    coffee (80 CZK, not a member), cake (250 CZK, member), schnitzel (300 CZK, not a member), tea (40 CZK, member).

    ```workflow
    Say "Opening the checkout"
    while (Any order is left in the queue):
        if (The price of the first order in the queue is over 100 CZK):
            if (The customer of the first order is a club member):
                Charge("first order in the queue", "10% discount")
            else:
                Charge("first order in the queue", "full price")
        else:
            Charge("first order in the queue", "full price")
        Remove the first order from the queue
    Say "Checkout closed"

    # TASKS
    Charge(order, price):
        Announce("{order}")
        Say "Price: {price}"
    Announce(order): Say "Processing {order}"
    ```
graders:
  - type: skill_invocation
    name: loads-skill
    config:
      mode: any_order
      required_skills:
        - exec-synt-workflow
  - type: prompt
    name: follows-full-flow
    config:
      continue_session: true
      prompt: |
        You are now grading the agent's replies above, not continuing the work. The queue         holds coffee (80 CZK, not a member), cake (250 CZK, member), schnitzel (300 CZK, not a member), tea (40 CZK, member). The correct run, in this order: say "Opening the checkout"; then one loop iteration per order, each saying "Processing <order>" (the task Announce, called from the task Charge) followed by "Price: <price>":
                - coffee: "Price: full price" (price not above 100 CZK),
                - cake: "Price: 10% discount" (above 100 CZK and a member),
                - schnitzel: "Price: full price" (above 100 CZK, not a member),
                - tea: "Price: full price" (price not above 100 CZK, so the member check is not applied);
                then, with the queue empty, say "Checkout closed". Check:
                1. The reply contains the exact text "Opening the checkout" before any "Processing …" line.
                2. The orders are processed in the queue order coffee, cake, schnitzel, tea, each exactly once (an order's wording may differ slightly, e.g. "first order in the queue" replaced by its name, but no order is skipped, repeated or reordered, and there is no fifth iteration).
                3. For each order the "Processing …" line comes before its "Price: …" line, and the price of each order matches the list above (only cake gets "10% discount", the other three "full price").
                4. "Checkout closed" appears exactly once, after the last order's "Price: …" line.
        5. The reply does not narrate the execution: no explanation of conditions, branches, tasks or loop iterations, no list of steps; only what the workflow prescribes.
        For each criterion call set_waza_grade_pass if it is met or set_waza_grade_fail if it is not, naming the criterion number in the description.
