id: notifies-after-work
name: Notifies after finishing work
description: Asked to run /notify, the agent loads the skill to notify the user after finishing work.
tags:
  - trigger
inputs:
  prompt: "I'm stepping away. Create hello.py that prints 'Hello, world!', then run /notify to tell me you're done."
graders:
  - type: skill_invocation
    name: loads-skill
    config:
      mode: any_order
      required_skills:
        - notify
