id: notifies-after-work
name: Notifies after finishing work
description: Asked to message the user remotely, the agent loads the skill on its own to notify them after finishing work.
tags:
  - trigger
inputs:
  prompt: "I'm stepping away — message me when you're done. Create hello.py that prints 'Hello, world!'."
graders:
  - type: skill_invocation
    name: loads-skill
    config:
      mode: any_order
      required_skills:
        - notify
