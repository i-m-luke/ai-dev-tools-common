name: help-with-text
description: Checks that /help-with-text proposes wordings and placements first and writes only the one the user picks.
skill: help-with-text
version: "1.0"
config:
  trials_per_task: 1
  timeout_seconds: 300
  executor: copilot-sdk
  model: claude-sonnet-5.5
  # User-invoked skill: the SDK does not expand slash commands, so the body is injected
  # to stand in for the user typing /help-with-text.
  inject_skill_body: true
  skill_directories:
    - ../../skills
metrics:
  - name: task_completion
    weight: 1.0
    threshold: 1.0
tasks:
  - "tasks/*.yaml"
