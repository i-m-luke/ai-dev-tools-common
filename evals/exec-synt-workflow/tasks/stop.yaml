id: stop
name: Stop inside a task ends the whole workflow
description: Given a workflow whose task calls Stop with a reason, the agent loads the skill on its own, says the steps before the Stop, reports the reason and executes no step after it, neither in the task nor in the main flow.
tags:
  - behavior
inputs:
  prompt: |
    Execute this workflow. The invoice is damaged.

    ```workflow
    Řekni "Začínám zpracování"
    Zpracuj("faktura")
    Řekni "Zpracování dokončeno"

    # TASKS
    Zpracuj(dokument):
        Řekni "Zpracovávám {dokument}"
        if (Dokument je poškozený):
            Stop("Dokument je poškozený")
        Řekni "Dokument {dokument} zpracován"
    ```
graders:
  - type: skill_invocation
    name: loads-skill
    config:
      mode: any_order
      required_skills:
        - exec-synt-workflow
  - type: prompt
    name: stops-with-reason
    config:
      continue_session: true
      prompt: |
        You are now grading the agent's replies above, not continuing the work. The workflow calls the task Zpracuj("faktura"), which says "Zpracovávám faktura", then, because the invoice is damaged, calls Stop("Dokument je poškozený"). The correct run: say "Začínám zpracování", say "Zpracovávám faktura", then end the whole workflow and tell the user the reason "Dokument je poškozený". Check:
        1. The reply contains the exact text "Začínám zpracování".
        2. The reply contains the exact text "Zpracovávám faktura".
        3. The reply tells the user the reason for stopping: the Stop reason "Dokument je poškozený" (verbatim or clearly the same message).
        4. The reply does not contain "Dokument faktura zpracován" (the step in the task after Stop).
        5. The reply does not contain "Zpracování dokončeno" (the step in the main flow after the task call).
        For each criterion call set_waza_grade_pass if it is met or set_waza_grade_fail if it is not, naming the criterion number in the description.
